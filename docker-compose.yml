# Local development only. Production runs behind Caddy and is configured through the host's
# environment, not this file. Copy .env.example to .env and fill it in before starting.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-devanshedutech}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      POSTGRES_DB: ${DATABASE_NAME:-devanshedutech}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-devanshedutech}"]
      interval: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    restart: always
    environment:
      # The application reads DATABASE_* rather than SPRING_DATASOURCE_*; see application.yml.
      - DATABASE_URL=jdbc:postgresql://db:5432/${DATABASE_NAME:-devanshedutech}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-devanshedutech}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000}
      - SUPER_ADMIN_EMAILS=${SUPER_ADMIN_EMAILS:-}
      - CRM_TIMEZONE=${CRM_TIMEZONE:-Asia/Kolkata}
      # Local staging is plain HTTP. Never do this on anything reachable from the internet.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Optional features.
      #
      # Note the placeholder fallbacks rather than empty strings. Spring's OAuth2 client
      # autoconfiguration rejects an EMPTY client id outright — "Client id must not be
      # empty" — and an empty environment variable counts as set, so it overrides the
      # default in application.yml and the application refuses to start. An unusable
      # placeholder is fine: Google sign-in simply does not work until real credentials
      # are supplied, and everything else runs.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-your_cloud_name}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-your_api_key}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-your_api_secret}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder-id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-placeholder-secret}
      # The follow-up pass changes lead grades on a schedule. Off by default locally.
      - LADDER_ENABLED=${LADDER_ENABLED:-false}
      # Empty means the swipe hands off to the counsellor's own WhatsApp; set it and the
      # message goes to the student directly.
      # WhatsApp. Meta's own Cloud API is the one to test on — its test number sends free
      # messages to up to five recipients you verify in the dashboard.
      - WHATSAPP_CHANNEL=${WHATSAPP_CHANNEL:-auto}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_TEMPLATE=${WHATSAPP_TEMPLATE:-hello_world}
      - WHATSAPP_TEMPLATE_LANGUAGE=${WHATSAPP_TEMPLATE_LANGUAGE:-en_US}
      - AISENSY_API_KEY=${AISENSY_API_KEY:-}
      - AISENSY_CAMPAIGN=${AISENSY_CAMPAIGN:-crm_message}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # Off by default. Turned on only long enough to create the first account on an empty
      # database, since there is no administrator yet to create one for you.
      - SELF_REGISTRATION_ENABLED=${SELF_REGISTRATION_ENABLED:-false}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    # Builds the sibling frontend repository. Both repos must sit in the same folder.
    build: ../devanshedutech-frontend
    restart: always
    ports:
      - "8000:80"
    depends_on:
      - backend

volumes:
  pgdata:
