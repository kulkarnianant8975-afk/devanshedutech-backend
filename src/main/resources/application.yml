spring:
  application:
    name: backend-springboot

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 20000
      minimum-idle: 1
      maximum-pool-size: 10
      idle-timeout: 600000
      max-lifetime: 1800000

  gemini:
    # Empty rather than required. The website chatbot is an optional feature and already
    # degrades cleanly when the key is missing — but a placeholder with no default fails
    # placeholder resolution at startup, so the whole application refused to boot without it.
    api-key: ${GEMINI_API_KEY:}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

  servlet:
    multipart:
      max-file-size: 60MB   # Matches controller limit for brochures
      max-request-size: 60MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-secret}
            scope:
              - email
              - profile

server:
  port: 8080
  forward-headers-strategy: NATIVE
  tomcat:
    max-http-form-post-size: 15MB
    max-swallow-size: 15MB
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024  # Only compress responses > 1KB
  servlet:
    session:
      cookie:
        # Secure cookies are correct in production, where Caddy terminates TLS. A browser
        # refuses to store one over plain HTTP, so local staging on http://localhost would
        # appear to accept a login and then behave as though nobody had signed in.
        # Never set this to false for anything reachable from the internet.
        secure: ${COOKIE_SECURE:true}
        # 'lax' is correct now that the SPA and the API share one origin behind Caddy.
        # It was 'none' only because the frontend (Vercel) and backend (Render) were
        # cross-site; 'none' is increasingly blocked by browser privacy controls.
        same-site: lax
        http-only: true

app:
  # CORS. The FIRST entry is also used as the post-login redirect target by
  # OAuth2LoginSuccessHandler, so the canonical public origin must come first.
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

  # Roles pinned by configuration, comma-separated. A pinned address always resolves to that
  # role regardless of what is stored on the user row, which is the bootstrap path: an owner
  # listed here gets access on their first Google sign-in, before any account exists to grant
  # it to them. Day-to-day role changes are made in the Team screen and stored on the user.
  # Previously ADMIN_EMAILS was hardcoded in two Java classes that could silently disagree.
  super-admin:
    emails: ${SUPER_ADMIN_EMAILS:}
  admin:
    emails: ${ADMIN_EMAILS:kulkarnianant8975@gmail.com,dipaliatdevanshedutech@gmail.com}
  manager:
    emails: ${MANAGER_EMAILS:}
  counsellor:
    emails: ${COUNSELLOR_EMAILS:}
  viewer:
    emails: ${VIEWER_EMAILS:}

  # Who this institute is. The chatbot speaks to prospective students as the institute, so
  # anything wrong here is wrong in front of them — it had been telling everyone the institute
  # was in Pune.
  institute:
    name: ${INSTITUTE_NAME:Devansh Edu-Tech Classes}
    city: ${INSTITUTE_CITY:Parbhani}
    state: ${INSTITUTE_STATE:Maharashtra}
    phone: ${INSTITUTE_PHONE:+91 8669880738}

  crm:
    # Every follow-up rule is a date rather than an instant, so the whole application resolves
    # "today" in the institute's zone rather than the server's.
    timezone: ${CRM_TIMEZONE:Asia/Kolkata}
    ladder:
      enabled: ${LADDER_ENABLED:true}
      # Runs before the institute opens, so the day's work is laid out on arrival.
      cron: ${LADDER_CRON:0 0 6 * * *}
      # Slack after the final step before a lead decays a grade.
      grace-days: ${LADDER_GRACE_DAYS:3}
      # A reply this recent freezes decay — never demote somebody who just spoke to you.
      reply-freeze-hours: ${LADDER_REPLY_FREEZE_HOURS:48}
      # Below this many real touches, a closed lead is flagged as never actually worked.
      worked-threshold: ${LADDER_WORKED_THRESHOLD:3}
    notifications:
      # Runs just after the follow-up pass, so the day's work is already decided.
      cron: ${NOTIFICATION_CRON:0 15 6 * * *}
      cleanup-cron: ${NOTIFICATION_CLEANUP_CRON:0 30 3 * * SUN}
    # The address WhatsApp will fetch attachments from. Media is pulled by WhatsApp's own
    # servers, so a relative path or localhost is accepted by the API and then never arrives.
    public-base-url: ${PUBLIC_BASE_URL:}

    whatsapp:
      # The institute's number, digits only with country code.
      number: ${WHATSAPP_NUMBER:917972217407}
      # Which channel sends: auto, meta, aisensy or manual.
      #
      # auto uses whatever is configured, preferring Meta's own Cloud API. Pin it to one value
      # while testing — otherwise adding a second set of keys silently moves every message.
      channel: ${WHATSAPP_CHANNEL:auto}
      meta:
        # From the WhatsApp page of a Meta app. The test number there sends free messages to up
        # to five recipients you add and verify in the dashboard, which is the cheapest way to
        # watch a real message land on a real phone before choosing a provider.
        #
        # A test token lasts 24 hours. For anything beyond testing, create a permanent token
        # from a System User instead.
        access-token: ${WHATSAPP_ACCESS_TOKEN:}
        # The numeric id shown beside the number in the dashboard, NOT the phone number.
        phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
        api-version: ${WHATSAPP_API_VERSION:v25.0}
        # hello_world is pre-approved on every test number, so a first test needs nothing
        # submitted for review.
        template: ${WHATSAPP_TEMPLATE:hello_world}
        template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:en_US}
      aisensy:
        # Set this and the swipe sends to the student directly. Leave it empty and the message
        # opens in the counsellor's own WhatsApp instead, so the product works either way.
        api-key: ${AISENSY_API_KEY:}
        url: ${AISENSY_URL:https://backend.aisensy.com/campaign/t1/api/v2}
        # The approved template used when the 24-hour free-reply window has closed.
        campaign: ${AISENSY_CAMPAIGN:crm_message}
    capture:
      # A student submits once; a college seminar on one office wifi is a legitimate burst.
      rate-limit-per-minute: ${CAPTURE_RATE_LIMIT:6}
    metrics:
      # Below this many records a rate is noise, so it is withheld rather than printed.
      min-sample: ${METRICS_MIN_SAMPLE:5}

  auth:
    # Open sign-up is off: this is an internal CRM and accounts are created by a manager.
    # Anyone who registered while it was open holds the NONE role and has no access.
    self-registration-enabled: ${SELF_REGISTRATION_ENABLED:false}

# Cloudinary CDN Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name}
  api-key: ${CLOUDINARY_API_KEY:your_api_key}
  api-secret: ${CLOUDINARY_API_SECRET:your_api_secret}
