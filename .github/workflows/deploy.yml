name: Deploy CRM

# Updates the Devansh stack that is already running on the VPS at /srv/devanshedutech.
#
# It runs from GitHub rather than anyone's laptop because the institute's own network cannot
# reach that VPS at all — every port, and Hostinger's browser terminal with it, is blocked at the
# provider's edge. GitHub's runners are unaffected, so this is the only route that reliably
# works.
#
# Deliberately narrow. The box also hosts two other projects and a Caddy that owns 80 and 443 for
# all of them, so this touches exactly three things: the backend image, the frontend's static
# files, and BACKEND_TAG. It never rewrites .env, never edits the Caddyfile, and never runs a
# compose command outside /srv/devanshedutech.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        default: ''
      ladder_enabled:
        description: 'Run the daily follow-up pass? Leave false for the first deploy.'
        required: true
        default: 'false'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  STACK_DIR: /srv/devanshedutech

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        if: inputs.confirm != 'DEPLOY'
        run: |
          echo "::error::Type DEPLOY in the confirmation box to run this."
          exit 1

      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # The gate. A deploy that skips the tests ships a broken CRM to people who are mid
      # conversation with students.
      - name: Run the test suite
        run: mvn -B verify

      - name: Build the backend image
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          docker build -t "devanshedutech-backend:$TAG" .
          docker save "devanshedutech-backend:$TAG" | gzip > backend-image.tar.gz
          ls -lh backend-image.tar.gz

      - name: Check out the frontend
        uses: actions/checkout@v4
        with:
          repository: kulkarnianant8975-afk/devanshedutech-frontend
          ref: ${{ github.ref_name }}
          path: frontend-src

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-src/package-lock.json

      # The production frontend is not an image — Caddy serves plain files from
      # frontend/current. So this ships a directory, not a container.
      - name: Build the frontend
        working-directory: frontend-src
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
          ls dist | head

      # The host is pinned from a secret, not fetched at deploy time. Running ssh-keyscan here
      # would accept whatever answers on that address on every single run — trust on first use,
      # forever, which is the same guarantee as StrictHostKeyChecking=no. Rebuild the server and
      # this now fails loudly until the secret is updated, which is the correct behaviour.
      - name: Set up the deploy key and pin the host
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! grep -q . ~/.ssh/known_hosts; then
            echo "::error::VPS_HOST_KEY secret is empty. Capture it with: ssh-keyscan -t ed25519 <host>"
            exit 1
          fi

      # Refuses rather than guesses. Two other projects live on this machine and one of them owns
      # the public ports; anything unexpected here means stop, not improvise.
      - name: Pre-flight
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$USER@$HOST" bash -se <<'EOF'
          set -e
          cd /srv/devanshedutech || { echo "::error::/srv/devanshedutech is missing."; exit 1; }
          [ -f .env ] || { echo "::error::.env is missing. It is never written by this workflow."; exit 1; }
          grep -q '^BACKEND_TAG=' .env || { echo "::error::BACKEND_TAG is not set in .env."; exit 1; }
          [ -d frontend/current ] || { echo "::error::frontend/current is missing."; exit 1; }
          docker compose config -q || { echo "::error::the compose file does not parse."; exit 1; }

          # The timezone migration must have run before this code starts. TimeZoneConfig calls
          # TimeZone.setDefault at startup, so the application moves to IST whatever the container
          # says — and if the five wall-clock columns have not been shifted, old and new rows end
          # up five and a half hours apart with nothing to indicate it. Checked rather than
          # trusted, because the failure is silent and permanent.
          APPLIED=$(docker exec dvt-postgres psql -U devanshedutech -d devanshedutech -tAc \
            "select count(*) from schema_migrations where name='utc-to-ist-timestamps'" 2>/dev/null || echo "0")
          if [ "$APPLIED" != "1" ]; then
            echo "::error::The utc-to-ist-timestamps migration has not run. Deploying now would"
            echo "::error::leave existing timestamps 5h30m behind every new one. See"
            echo "::error::deploy/MIGRATION-utc-to-ist.sql — run it with dvt-backend stopped."
            exit 1
          fi
          echo "Timezone migration: applied."

          # Same reasoning for the settings the CRM needs. Without them the application starts
          # perfectly and quietly does nothing — no WhatsApp, no webhook, no super admin — which
          # is harder to notice than a crash.
          for KEY in CRM_TIMEZONE PUBLIC_BASE_URL SUPER_ADMIN_EMAILS WHATSAPP_APP_SECRET; do
            grep -q "^$KEY=." .env || { echo "::error::$KEY is missing from .env"; exit 1; }
          done
          echo "Required settings: present." 
          echo "Pre-flight passed. Current tag: $(grep '^BACKEND_TAG=' .env)"
          EOF

      - name: Copy the build across
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy backend-image.tar.gz "$USER@$HOST:/srv/devanshedutech/"
          # The compose file is version controlled now, so this is its source of truth. Kept
          # with a dated backup, because it is the file that decides whether the site starts.
          scp -i ~/.ssh/deploy deploy/docker-compose.vps.yml "$USER@$HOST:/srv/devanshedutech/docker-compose.yml.new"
          # rsync in place rather than swapping the directory: Caddy bind-mounts
          # frontend/current, and moving it would leave the container serving the old inode.
          rsync -az --delete -e "ssh -i ~/.ssh/deploy" \
            frontend-src/dist/ "$USER@$HOST:/srv/devanshedutech/frontend/current/"

      - name: Deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          TAG: ${{ env.TAG }}
          LADDER: ${{ inputs.ladder_enabled }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$USER@$HOST" TAG="$TAG" LADDER="$LADDER" bash -se <<'EOF'
          set -e
          cd /srv/devanshedutech

          # Kept so a bad release can be rolled back by hand in one command.
          PREVIOUS=$(grep '^BACKEND_TAG=' .env | cut -d= -f2)
          echo "Previous tag was $PREVIOUS"

          if [ -f docker-compose.yml.new ]; then
            cp -a docker-compose.yml "docker-compose.yml.bak-$(date +%Y%m%d-%H%M%S)"
            mv docker-compose.yml.new docker-compose.yml
            docker compose config -q || { echo "::error::the new compose file does not parse; restore a .bak"; exit 1; }
          fi

          docker load < backend-image.tar.gz
          rm -f backend-image.tar.gz

          # The only line of .env this workflow ever changes.
          sed -i "s/^BACKEND_TAG=.*/BACKEND_TAG=$TAG/" .env
          sed -i "s/^LADDER_ENABLED=.*/LADDER_ENABLED=$LADDER/" .env || true
          grep -q '^LADDER_ENABLED=' .env || echo "LADDER_ENABLED=$LADDER" >> .env

          docker compose up -d dvt-backend
          echo "ROLLBACK: sed -i 's/^BACKEND_TAG=.*/BACKEND_TAG=$PREVIOUS/' .env && docker compose up -d dvt-backend"
          EOF

      # Checked from here, because the institute's machine cannot reach the VPS.
      - name: Verify it came up
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$USER@$HOST" bash -se <<'EOF'
          set -e
          cd /srv/devanshedutech
          for i in $(seq 1 40); do
            if docker exec dvt-backend wget -qO- http://127.0.0.1:8080/api/courses > /dev/null 2>&1; then
              echo "The backend is answering."
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          echo "::error::It did not answer within about three minutes. Recent logs:"
          docker compose logs --tail 80 dvt-backend
          exit 1
          EOF

      - name: Report the startup runners
        if: success()
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$USER@$HOST" \
            "cd /srv/devanshedutech && docker compose logs --since 5m dvt-backend | grep -E 'Backfilled|Seeded|Team:|Opening hours|waiting to be graded' || true"
