name: Perf probe

# Why this runs on GitHub rather than on a laptop:
#
# Hostinger's edge blocks the office IP whenever it sees machine-timed requests, and it blocks it
# provider-wide — SSH, HTTPS, and the browser terminal all go dark at once. Measuring a site
# repeatedly is exactly the pattern that triggers it. GitHub's runners are not affected, so any
# probe that runs more than once belongs here.
#
# Manual only. Nothing about this should run on a schedule.

on:
  workflow_dispatch:
    inputs:
      site:
        description: Public site to measure
        default: https://www.devanshedutech.com
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Time the pages a visitor actually waits for
        env:
          SITE: ${{ inputs.site }}
        run: |
          FMT='  dns %{time_namelookup}s  tls %{time_appconnect}s  ttfb %{time_starttransfer}s  total %{time_total}s  %{size_download} bytes  (%{http_code})\n'
          for path in / /courses /api/courses; do
            echo "$SITE$path"
            curl -sS --compressed -o /dev/null -w "$FMT" "$SITE$path" || echo "  FAILED"
          done

      - name: Weigh the courses payload
        env:
          SITE: ${{ inputs.site }}
        run: |
          curl -sS --compressed "$SITE/api/courses" -o courses.json
          echo "  /api/courses uncompressed: $(wc -c < courses.json) bytes"
          echo "  courses: $(jq 'length' courses.json)"
          echo
          # The question this answers: is an image a short CDN link, or a whole base64 file
          # embedded in the JSON that every visitor downloads before the page can render?
          jq -r '.[] | "    \(.name[0:34]) | \(if (.image // "") == "" then "NO IMAGE" elif (.image | startswith("data:")) then "BASE64 INLINE" else "link" end) | \((.image // "") | length) chars"' courses.json
          echo
          INLINE=$(jq '[.[] | select((.image // "") | startswith("data:"))] | length' courses.json)
          WEIGHT=$(jq '[.[] | select((.image // "") | startswith("data:")) | (.image | length)] | add // 0' courses.json)
          MISSING=$(jq -r '[.[] | select((.image // "") == "") | .name] | join(", ")' courses.json)
          echo "  base64 images: $INLINE  carrying $WEIGHT chars"
          echo "  no image at all: $MISSING"

      - name: Weigh the images a visitor downloads
        env:
          SITE: ${{ inputs.site }}
        run: |
          # The card slot is 192px tall. If these come back as multi-megabyte originals, the
          # browser is downloading a full-resolution photo to paint a thumbnail.
          jq -r '.[] | select((.image // "") | startswith("http")) | .image' courses.json | head -6 > urls.txt
          TOTAL=0
          while read -r url; do
            BYTES=$(curl -sS -o /dev/null -w '%{size_download}' -H 'Accept: image/avif,image/webp,*/*' "$url")
            TOTAL=$((TOTAL + BYTES))
            printf '  %9s bytes  %s\n' "$BYTES" "$(echo "$url" | cut -c1-96)"
          done < urls.txt
          echo
          echo "  first six course images total: $TOTAL bytes"
          echo
          # The same images asked for at card size. f_auto/q_auto were already being applied by
          # the frontend; w_600,c_limit is the part that was missing.
          SIZED=0
          while read -r url; do
            SMALL=$(echo "$url" | sed 's#/upload/#/upload/f_auto,q_auto,w_600,c_limit/#')
            BYTES=$(curl -sS -o /dev/null -w '%{size_download}' -H 'Accept: image/avif,image/webp,*/*' "$SMALL")
            SIZED=$((SIZED + BYTES))
            printf '  %9s bytes  (card size)\n' "$BYTES"
          done < urls.txt
          echo
          echo "  at card size: $SIZED bytes, down from $TOTAL"

      - name: Check what the front page ships
        env:
          SITE: ${{ inputs.site }}
        run: |
          curl -sS --compressed "$SITE/" -o index.html
          echo "  index.html $(wc -c < index.html) bytes"
          # Compression and cache headers are the cheap wins, so report them rather than assume.
          for asset in $(grep -o '/assets/[A-Za-z0-9._-]*\.\(js\|css\)' index.html | sort -u); do
            echo "  $asset"
            curl -sSI --compressed "$SITE$asset" \
              | grep -iE 'content-encoding|cache-control|content-length|^HTTP' | sed 's/^/    /'
          done

      - name: Is the live bundle actually the current one
        env:
          SITE: ${{ inputs.site }}
        run: |
          # The decisive question. "My Day", "Pipeline" and "Student Leads" are gated on the same
          # permission, so a menu showing one but not the others cannot come from current code —
          # it can only be an older bundle. This says whether the old bundle is what the server
          # sends, or what a browser kept.
          echo "== index.html as the server sends it =="
          curl -sSI "$SITE/" | grep -iE '^HTTP|cache-control|etag|last-modified|age|cf-cache' | sed 's/^/  /'
          echo
          curl -sS --compressed "$SITE/" -o live.html
          MAIN=$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' live.html | head -1)
          echo "  index.html points at: $MAIN"
          echo
          echo "== what the app actually contains =="
          # Every route on this site is lazy-loaded, so the entry chunk contains almost none of
          # the app. Grepping only that file reported "My Day" as missing from a site that
          # plainly has it. The chunk filenames are referenced from inside the entry bundle, so
          # they are pulled out of it and searched too.
          curl -sS --compressed "$SITE$MAIN" -o main.js
          grep -oE '"?/?assets/[A-Za-z0-9_-]+\.js' main.js \
            | tr -d '"' | sed 's#^/*#/#' | sort -u > chunks.txt
          echo "  entry plus $(wc -l < chunks.txt) lazy chunk(s)"
          cat main.js > all.js
          while read -r chunk; do
            curl -sS --compressed "$SITE$chunk" >> all.js 2>/dev/null || true
          done < chunks.txt
          echo "  searching $(wc -c < all.js) bytes of application code"
          echo
          for phrase in 'bg-teal-500' 'Follow-up log' 'Follow-up flow' 'Attach from the Media Library' 'How it works'; do
            if grep -qF "$phrase" all.js; then echo "  PRESENT  $phrase"; else echo "  MISSING  $phrase"; fi
          done
          echo
          echo "== service worker =="
          curl -sS -o sw.js -w '  /sw.js -> %{http_code}, %{size_download} bytes\n' "$SITE/sw.js"
          # A precached index.html is how a browser keeps serving last week's app forever.
          grep -o 'index.html' sw.js | head -1 | sed 's/^/  sw precaches: /' || echo "  sw does not name index.html"

      - name: What the Student Reviews page will show
        env:
          SITE: ${{ inputs.site }}
        run: |
          # This is the endpoint the page calls, and it is public — so this is exactly what a
          # visitor's browser gets, with no guessing about database state in between.
          echo "== /api/public/reviews =="
          curl -sS -w '  HTTP %{http_code}, %{size_download} bytes\n' \
            "$SITE/api/public/reviews" -o reviews.json
          echo
          COUNT=$(jq 'length' reviews.json 2>/dev/null || echo "unparseable")
          echo "  videos published to the website: $COUNT"
          jq -r '.[] | "    \(.name)  ->  \(.url)"' reviews.json 2>/dev/null || cat reviews.json
          echo
          # A published video is no use if the file itself will not load.
          FIRST=$(jq -r '.[0].url // empty' reviews.json 2>/dev/null)
          if [ -n "$FIRST" ]; then
            echo "== is that file actually playable =="
            curl -sSI "$SITE$FIRST" | grep -iE '^HTTP|content-type|content-length|accept-ranges' | sed 's/^/  /'
          else
            echo "  Nothing published, so the page shows its \"on their way\" message."
          fi
